name: Test and publish

on:
  push:
    branches: [main, claude/project-thread-woqfg6]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The /test-v2.0/ test build came off the site once Release v1.0 reached main (Boss, 7 Nov 2026:
# "just need it gone now"). Ask Boss before publishing a test build beside it again.
# The sound build goes beside main at /test-audio/ with its own saves (Boss, 7 Nov 2026: "build so
# i can test from a published page before we merge to main"). Take PREVIEW_BRANCH out, and the
# branch out of the push trigger, when it is merged.
env:
  PREVIEW_BRANCH: claude/project-thread-woqfg6
  PREVIEW_PATH: test-audio

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds the site: main at the root and the test branch in PREVIEW_PATH, so publishing from
  # either branch keeps both. Runs on pushes to main or the test branch.
  site:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/project-thread-woqfg6')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        id: preview
        continue-on-error: true
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json
      - name: Build main
        working-directory: main
        run: npm ci && npm run build
      - name: Build the test branch into its folder
        if: steps.preview.outcome == 'success'
        working-directory: preview
        env:
          VITE_STORE_NAMESPACE: "mxrpg-${{ env.PREVIEW_PATH }}:"
        run: |
          npm ci && npm run build
          cp -r dist "../main/dist/$PREVIEW_PATH"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist

  # Publishes the playable build to GitHub Pages. Needs Settings > Pages > Source: GitHub Actions,
  # and the test branch allowed in Settings > Environments > github-pages (deployment branches).
  deploy:
    needs: site
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
