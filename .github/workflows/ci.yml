name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The /test-v2.0/ test build came off the site once Release v1.0 reached main (Boss, 7 Nov 2026:
# "just need it gone now"), so the site is main alone. Ask Boss before publishing a test build
# beside it again.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds the site from main. Runs on pushes to main.
  site:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json
      - name: Build main
        working-directory: main
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist

  # Publishes the playable build to GitHub Pages. Needs Settings > Pages > Source: GitHub Actions.
  deploy:
    needs: site
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
