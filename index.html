<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <!-- Added to a phone's home screen, the game opens full screen with no browser bars. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Motocross RPG" />
    <meta name="theme-color" content="#14141e" />
    <link rel="manifest" href="./app.webmanifest" />
    <title>Motocross RPG: The Road to Legend</title>
    <style>
      /* No pinch or double-tap zoom: a zoomed-in page leaves part of the game off screen. */
      html, body { margin: 0; height: 100%; background: #14141e; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
      /* dvh is the visible height in a mobile browser, between its toolbars; vh is the fallback. */
      #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
      canvas { display: block; image-rendering: pixelated; touch-action: none; }
      /* The game is laid out for a landscape screen: a phone held upright is asked to turn. */
      #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #14141e; color: #e8dbb8;
        font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif; text-align: center;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; }
      #rotate .phone { width: 64px; height: 110px; border: 4px solid #ef6c18; border-radius: 12px; animation: turn 2.4s ease-in-out infinite; }
      #rotate h1 { margin: 0; font-size: 26px; color: #ef6c18; }
      #rotate p { margin: 0; font-size: 18px; line-height: 1.4; max-width: 300px; }
      @keyframes turn { 0%, 25% { transform: rotate(0); } 50%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
      @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone"></div>
      <h1>Turn your phone sideways</h1>
      <p>Motocross RPG plays in landscape. For the most room, add it to your home screen to play full screen.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
